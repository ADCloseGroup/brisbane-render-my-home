[build]
  command = "npm run build"
  publish = ".next"

# Official Next.js runtime for Netlify (App Router, route handlers, ISR)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Route handlers under /app/api/* run as Netlify Functions automatically.
# Bump the render function timeout — image generation can take 15–40s.
[functions]
  node_bundler = "esbuild"

[functions."api/generate"]
  # Netlify Functions max is 26s on Pro; use background if you need longer.
  timeout = 26

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"
